name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validators
        run: python -m pip install --disable-pip-version-check ruff mypy bandit pyyaml
      - name: Validate Skill metadata
        run: python scripts/quick_validate.py .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Compile
        run: python -m compileall -q scripts tests
      - name: Lint
        run: ruff check scripts tests
      - name: Type check
        run: mypy scripts tests
      - name: Security scan
        run: bandit -q -r scripts -ll
